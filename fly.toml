app = "your-outreach-app"
primary_region = "iad"

[build]

[env]
  PORT    = "8080"
  HOST    = "0.0.0.0"
  DB_PATH = "/data/outreach.db"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source      = "outreach_data"
  destination = "/data"
