<div class="modal-overlay" id="modal-preview">
  <div class="modal" style="max-width:700px">
    <button class="modal-close" onclick="closeModal('modal-preview')">✕</button>
    <h2>Email Preview</h2>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="form-group" style="margin:0">
        <label>First name</label>
        <input id="preview-first-name" value="Sarah" oninput="refreshPreview()" />
      </div>
      <div class="form-group" style="margin:0">
        <label>Last name</label>
        <input id="preview-last-name" value="Jones" oninput="refreshPreview()" />
      </div>
      <div class="form-group" style="margin:0">
        <label>Company</label>
        <input id="preview-company" value="Acme Dental" oninput="refreshPreview()" />
      </div>
    </div>

    <div style="background:var(--bg3);border:1px solid var(--border2);border-radius:10px;overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)">
        <span style="display:inline-block;width:60px">Subject:</span>
        <span id="preview-subject" style="color:var(--text);font-weight:500"></span>
      </div>
      <div style="padding:20px 16px;background:#fff;border-radius:0 0 10px 10px;min-height:180px">
        <iframe id="preview-iframe"
          style="width:100%;border:none;min-height:240px;display:block"
          sandbox="allow-same-origin"
          title="Email preview"></iframe>
      </div>
    </div>
    <p id="preview-loading" class="text-muted text-small" style="margin-top:8px;text-align:center;display:none">Rendering…</p>
  </div>
</div>
