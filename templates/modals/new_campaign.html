<div class="modal-overlay" id="modal-new-campaign">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-new-campaign')">✕</button>
    <h2>New Campaign</h2>
    <div class="form-group"><label>Campaign Name</label><input id="nc-name" placeholder="Clinic Outreach – May 2025" /></div>
    <div class="form-grid">
      <div class="form-group"><label>Daily Email Limit</label><input id="nc-limit" type="number" value="30" min="1" max="500" /><div class="form-hint">Start low while warming up (10–30/day)</div></div>
      <div class="form-group"><label>Min Delay Between Sends (sec)</label><input id="nc-mindelay" type="number" value="45" /></div>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>Send Window — Start Hour (UTC)</label><input id="nc-start" type="number" value="9" min="0" max="23" /></div>
      <div class="form-group"><label>Send Window — End Hour (UTC)</label><input id="nc-end" type="number" value="17" min="1" max="24" /></div>
    </div>
    <div class="form-group"><label>Max Delay Between Sends (sec)</label><input id="nc-maxdelay" type="number" value="120" /></div>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="createCampaign()">Create Campaign</button>
      <button class="btn btn-ghost" onclick="closeModal('modal-new-campaign')">Cancel</button>
    </div>
  </div>
</div>
