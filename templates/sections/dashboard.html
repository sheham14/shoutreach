<div class="section active" id="section-dashboard">
  <div class="page-header">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub">What's waiting on you, and how each channel is doing</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="refreshDashboard()">↻ Refresh</button>
  </div>

  <!-- The work first: each tile opens the list it counts. -->
  <div class="todo-grid" id="dash-todo"></div>

  <div class="channel-grid">
    <div class="card channel-card">
      <div class="card-header">
        <div class="card-title"><span class="channel-email">✉</span> Email</div>
        <button class="btn btn-ghost btn-sm" onclick="showSection('email')">Open →</button>
      </div>
      <div class="mini-stats" id="dash-email"></div>
    </div>
    <div class="card channel-card">
      <div class="card-header">
        <div class="card-title"><span class="channel-calling">☎</span> Calling</div>
        <button class="btn btn-ghost btn-sm" onclick="showSection('calling')">Open →</button>
      </div>
      <div class="mini-stats" id="dash-calling"></div>
    </div>
    <div class="card channel-card">
      <div class="card-header">
        <div class="card-title"><span class="channel-whatsapp">💬</span> WhatsApp</div>
        <button class="btn btn-ghost btn-sm" onclick="showSection('whatsapp')">Open →</button>
      </div>
      <div class="mini-stats" id="dash-whatsapp"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">All campaigns</div>
      <span class="text-muted text-small">Every channel in one list</span>
    </div>
    <div class="table-wrap">
      <table class="lead-table m-table">
        <thead><tr>
          <th>Campaign</th><th>Channel</th><th>Status</th><th>Leads</th>
          <th>Progress</th><th>Result</th><th></th>
        </tr></thead>
        <tbody id="dashboard-campaigns"></tbody>
      </table>
    </div>
  </div>
</div>
