<div class="section" id="section-whatsapp">
  <div class="page-header">
    <div>
      <div class="page-title">WhatsApp</div>
      <div class="page-sub">Nothing sends by itself — you always tap Send yourself, inside WhatsApp</div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="openWaImportModal()">+ Import leads</button>
      <button class="btn btn-ghost" onclick="toggleWaTemplateEditor()">✎ Templates</button>
    </div>
  </div>

  <div class="stat-grid" id="wa-summary" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px"></div>

  <div id="wa-template-editor" style="display:none;margin-bottom:20px"></div>

  <!-- Tabs are plain-language on purpose: whatever the database calls a
       lifecycle stage internally, this is what a non-technical operator
       needs to read to know what to do next. -->
  <div class="flex gap-2 items-center" style="margin-bottom:14px;flex-wrap:wrap">
    <button class="btn btn-primary" id="wa-tab-review" onclick="setWaBucket('review')">Needs review <span class="badge badge-gray" id="wa-count-review">0</span></button>
    <button class="btn btn-ghost"   id="wa-tab-ready"  onclick="setWaBucket('ready')">Ready to send <span class="badge badge-gray" id="wa-count-ready">0</span></button>
    <button class="btn btn-ghost"   id="wa-tab-due"    onclick="setWaBucket('due')">Follow-up due <span class="badge badge-gray" id="wa-count-due">0</span></button>
    <button class="btn btn-ghost"   id="wa-tab-cadence" onclick="setWaBucket('cadence')">Waiting for reply <span class="badge badge-gray" id="wa-count-cadence">0</span></button>
    <button class="btn btn-ghost"   id="wa-tab-all"     onclick="setWaBucket('all')">All</button>
  </div>

  <button class="btn btn-primary btn-sm" id="wa-draft-batch-btn" onclick="runWaDraftBatch()"
          style="margin-bottom:14px;display:none">
    ✎ Write messages for confirmed leads <span class="badge badge-gray" id="wa-count-confirmed">0</span>
  </button>

  <div class="card-title" id="wa-list-title" style="margin-bottom:10px">Needs review</div>
  <div class="text-muted text-small" id="wa-list-count" style="margin-bottom:10px"></div>
  <div class="wa-list" id="wa-list"></div>
</div>
