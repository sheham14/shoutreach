<div class="section" id="section-logs">
  <div class="page-header">
    <div class="page-title">Settings</div>
    <div class="flex gap-2">
      <button class="btn btn-ghost btn-sm" onclick="loadLogs()">↻ Refresh</button>
      <button class="btn btn-ghost btn-sm" onclick="clearAllLogs()">🧹 Clear all logs</button>
    </div>
  </div>
  <!-- Opened from Settings, so it carries Settings' tabs. -->
  <div class="tabs">
    <button class="tab" onclick="openSettingsTab('mine')">My settings</button>
    <button class="tab" onclick="openSettingsTab('team')">Team setup</button>
    <button class="tab active" onclick="showSection('logs')">Activity log</button>
    <button class="tab" onclick="showSection('database')">Database</button>
  </div>
  <div class="card">
    <div id="log-feed"></div>
  </div>
</div>
