{% from "macros/icons.html" import icon %}
<div class="section" id="section-database">
  <div class="page-header">
    <div>
      <div class="page-title">Settings</div>
      <div class="page-sub">Database — a read-only view; passwords are masked</div>
    </div>
  </div>
  <!-- Opened from Settings, so it carries Settings' tabs. -->
  <div class="tabs">
    <button class="tab" onclick="openSettingsTab('mine')">My settings</button>
    <button class="tab" onclick="openSettingsTab('team')">Team setup</button>
    <button class="tab" onclick="showSection('logs')">Activity log</button>
    <button class="tab active" onclick="showSection('database')">Database</button>
  </div>

  <div id="db-table-pills" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px"></div>

  <div id="db-table-view" style="display:none">
    <div class="card">
      <div class="card-header">
        <div class="card-title" id="db-table-name"></div>
        <div class="flex gap-2 items-center">
          <input id="db-search" class="search-input"
            placeholder="Search..."
            oninput="dbSearch()" />
          <div id="db-col-toggle-wrap" style="position:relative">
            <button class="btn btn-ghost btn-sm" onclick="dbToggleColDropdown()">{{ icon('columns-3', 14) }} Columns</button>
            <div id="db-col-dropdown"
                 style="display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:var(--z-menu);
                        background:var(--surface);border:1px solid var(--line);border-radius:8px;
                        padding:6px 0;min-width:160px;max-height:280px;overflow-y:auto;
                        box-shadow:var(--shadow)"></div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="dbExport()">{{ icon('download', 14) }} Export CSV</button>
          <span id="db-row-count" class="text-muted text-small tnum"></span>
        </div>
      </div>
      <div class="table-wrap" style="max-height:calc(100vh - 320px);overflow-y:auto">
        <table>
          <thead id="db-thead"></thead>
          <tbody id="db-tbody"></tbody>
        </table>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;
                  padding:12px 16px;border-top:1px solid var(--line)">
        <button class="btn btn-ghost btn-sm" id="db-prev" onclick="dbPage(-1)">{{ icon('arrow-left', 14) }} Prev</button>
        <span id="db-page-label" class="text-muted text-small tnum"></span>
        <button class="btn btn-ghost btn-sm" id="db-next" onclick="dbPage(1)">Next {{ icon('arrow-right', 14) }}</button>
      </div>
    </div>
  </div>
</div>
