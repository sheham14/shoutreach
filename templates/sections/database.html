<div class="section" id="section-database">
  <div class="page-header">
    <div>
      <div class="page-title">Database</div>
      <div class="page-sub">Read-only view — passwords are masked</div>
    </div>
  </div>

  <div id="db-table-pills" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px"></div>

  <div id="db-table-view" style="display:none">
    <div class="card">
      <div class="card-header">
        <div class="card-title" id="db-table-name"></div>
        <div class="flex gap-2 items-center">
          <input id="db-search"
            placeholder="Search..."
            oninput="dbSearch()"
            style="background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
                   padding:6px 12px;color:var(--text);font-size:13px;outline:none;width:200px;
                   font-family:var(--font)" />
          <div id="db-col-toggle-wrap" style="position:relative">
            <button class="btn btn-ghost btn-sm" onclick="dbToggleColDropdown()">⊞ Columns</button>
            <div id="db-col-dropdown"
                 style="display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:200;
                        background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
                        padding:6px 0;min-width:160px;max-height:280px;overflow-y:auto;
                        box-shadow:0 4px 20px rgba(0,0,0,.5)"></div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="dbExport()">⬇ Export CSV</button>
          <span id="db-row-count" class="text-muted text-small mono"></span>
        </div>
      </div>
      <div class="table-wrap" style="max-height:calc(100vh - 320px);overflow-y:auto">
        <table>
          <thead id="db-thead"></thead>
          <tbody id="db-tbody"></tbody>
        </table>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;
                  padding:12px 16px;border-top:1px solid var(--border)">
        <button class="btn btn-ghost btn-sm" id="db-prev" onclick="dbPage(-1)">← Prev</button>
        <span id="db-page-label" class="text-muted text-small mono"></span>
        <button class="btn btn-ghost btn-sm" id="db-next" onclick="dbPage(1)">Next →</button>
      </div>
    </div>
  </div>
</div>
