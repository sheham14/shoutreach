<div class="section" id="section-contacts">
  <div class="page-header">
    <div>
      <div class="page-title">Contacts</div>
      <div class="page-sub">Your global contact database</div>
    </div>
    <div class="flex gap-2">
      <button id="contacts-delete-selected-btn" class="btn btn-danger" onclick="deleteSelectedContacts()" disabled>✕ Delete Selected</button>
      <button class="btn btn-ghost" onclick="openAddContactModal()">+ Add Contact</button>
      <button class="btn btn-primary" onclick="openImportModal()">⬆ Import CSV</button>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="flex gap-2 items-center">
        <input id="contacts-search" placeholder="Search..."
               oninput="contactSearch()"
               style="background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
                      padding:6px 12px;color:var(--text);font-size:13px;outline:none;width:220px;
                      font-family:var(--font)" />
        <select id="contacts-source-filter" onchange="contactFilterChanged()"
                title="Filter by the scrape that produced these leads"
                style="background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
                       padding:6px 10px;color:var(--text);font-size:13px;outline:none;
                       max-width:260px;font-family:var(--font);cursor:pointer">
          <option value="">All lists</option>
        </select>
        <!-- The call sheet: "no website" is the strongest pitch for a
             web-design offer, and it was previously only findable by reading
             the status column row by row. -->
        <select id="contacts-status-filter" onchange="contactFilterChanged()"
                title="Filter by what the scraper found for each business"
                style="background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
                       padding:6px 10px;color:var(--text);font-size:13px;outline:none;
                       font-family:var(--font);cursor:pointer">
          <option value="">Any status</option>
          <option value="no_website">No website</option>
          <option value="no_email">No email</option>
          <option value="form_only">Form only</option>
          <option value="active">Emailable</option>
          <option value="bounced">Bounced</option>
          <option value="unsubscribed">Unsubscribed</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap">
          <input type="checkbox" id="contacts-show-deleted" onchange="contactFilterChanged()" style="cursor:pointer" />
          Show deleted
        </label>
      </div>
      <div class="flex gap-2 items-center">
        <span id="contacts-count" class="text-muted text-small mono"></span>
        <div id="contacts-col-toggle-wrap" style="position:relative">
          <button class="btn btn-ghost btn-sm" onclick="contactsToggleColDropdown()">⊞ Columns</button>
          <div id="contacts-col-dropdown"
               style="display:none;position:absolute;top:calc(100% + 4px);right:0;z-index:200;
                      background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
                      padding:6px 0;min-width:160px;
                      box-shadow:0 4px 20px rgba(0,0,0,.5)"></div>
        </div>
      </div>
    </div>
    <div id="contacts-selectall-bar"
         style="display:none;padding:8px 16px;background:var(--bg3);
                border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)"></div>
    <div class="table-wrap">
      <table>
        <thead id="contacts-thead"></thead>
        <tbody id="contacts-table"></tbody>
      </table>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;
                padding:12px 16px;border-top:1px solid var(--border)">
      <button class="btn btn-ghost btn-sm" id="contacts-prev" onclick="contactPageStep(-1)">← Prev</button>
      <span id="contacts-page-label" class="text-muted text-small mono"></span>
      <button class="btn btn-ghost btn-sm" id="contacts-next" onclick="contactPageStep(1)">Next →</button>
    </div>
  </div>

  <div class="section-gap"></div>

  <div>
    <div class="flex items-center" style="margin-bottom:14px">
      <div class="card-title">Unsubscribed</div>
      <div class="flex gap-2 ml-auto items-center">
        <span id="unsub-count" class="text-muted text-small"></span>
        <button class="btn btn-ghost btn-sm" onclick="exportUnsubscribed()">⬇ Export CSV</button>
      </div>
    </div>
    <div class="card" style="max-height:320px;overflow-y:auto">
      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Company</th><th>Unsubscribed</th></tr></thead>
        <tbody id="unsub-table"></tbody>
      </table>
    </div>
  </div>

  <div style="margin-top:32px">
    <div class="flex items-center" style="margin-bottom:8px">
      <div>
        <div class="card-title">Invalid Emails</div>
        <p class="text-muted text-small" style="margin-top:2px">Businesses whose email domain has no MX records — their email infrastructure may be broken or misconfigured. A potential sales signal.</p>
      </div>
      <div class="flex gap-2 ml-auto items-center">
        <span id="invalid-mx-count" class="text-muted text-small"></span>
        <button class="btn btn-ghost btn-sm" onclick="exportInvalidMx()">⬇ Export CSV</button>
      </div>
    </div>
    <div class="card" style="max-height:320px;overflow-y:auto">
      <table>
        <thead><tr><th>Email</th><th>Company</th><th>Website</th><th>Found</th></tr></thead>
        <tbody id="invalid-mx-table"></tbody>
      </table>
    </div>
  </div>
</div>
