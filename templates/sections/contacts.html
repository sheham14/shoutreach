<!-- Contacts: every business you have, whichever channel it's on -- or none.
     Each channel page lists only its own leads; this is the one place a
     business on no channel can still be found (Unassigned), and where you
     decide which channel something goes to next. -->
<div class="section" id="section-contacts">
  <div class="page-header">
    <div>
      <div class="page-title">Contacts</div>
      <div class="page-sub">Every business you have — on any channel, or none yet</div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-ghost" onclick="openImportModal()">⬆ Import CSV</button>
      <button class="btn btn-primary" onclick="openBusinessForm()">+ Add contact</button>
    </div>
  </div>

  <div class="tabs" data-tab-group="contacts">
    <button class="tab active" data-tab="all" onclick="setTab('contacts','all')">All contacts <span class="count">0</span></button>
    <button class="tab" data-tab="unassigned" onclick="setTab('contacts','unassigned')"
            title="Businesses that aren't on Email, Calling or WhatsApp">Unassigned <span class="count">0</span></button>
    <button class="tab" data-tab="dnc" onclick="setTab('contacts','dnc')"
            title="Asked not to be contacted, or unsubscribed">Do not contact <span class="count">0</span></button>
    <button class="tab" data-tab="deleted" onclick="setTab('contacts','deleted')"
            title="Deleted in the last 30 days — restore them from here">Recently deleted <span class="count">0</span></button>
  </div>

  <div class="work-split" id="ct-split" style="grid-template-columns:1fr">
    <div class="card">
      <div class="lt-toolbar">
        <input id="ct-search" class="search-input" placeholder="Search name, phone, email, city…" oninput="LT.ct.search()" />
        <select id="ct-channel" class="filter-select" onchange="LT.ct.filter()">
          <option value="">Any channel</option>
          <option value="email">On Email</option>
          <option value="calling">On Calling</option>
          <option value="whatsapp">On WhatsApp</option>
        </select>
        <select id="ct-source" class="filter-select" onchange="contactsSourceChanged()"
                title="Which scrape or import they came from">
          <option value="">All imports</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="ct-rename-list" style="display:none" onclick="renameSelectedList()"
                title="Give this import a name">Rename</button>
        <button class="btn btn-ghost btn-sm" id="ct-add-list" style="display:none" onclick="addSelectedListToChannel()"
                title="Send every business in this import to a channel and campaign">Add all in this import to…</button>
        <span class="lt-count" id="ct-count"></span>
      </div>
      <div class="text-muted text-small" id="ct-view-hint" style="display:none;padding:10px 16px;border-bottom:1px solid var(--border)"></div>
      <div id="ct-body"></div>
    </div>

    <div class="card work-panel sheet" id="ct-detail" style="display:none"></div>
  </div>

  <div class="card" id="ct-trash" style="display:none">
    <div class="text-muted text-small" style="padding:12px 16px;border-bottom:1px solid var(--border);line-height:1.6">
      Deleted leads are kept here for 30 days with everything they had — channels, messages, call history —
      then removed for good. Restoring puts them back exactly as they were.
    </div>
    <div id="ct-trash-body"></div>
  </div>
</div>
